<!DOCTYPE html>
<html lang="en">
<head>
    <title>Van Life Control</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="/static/css/stylesheet.css">
</head>
<body>
    <h1>Van Life Control</h1>

    {% include 'asset_navbar.html' %}

    <div class="temp-grid">
        <div class="temp-card">
            <div class="temp-label">Internal</div>
            <div class="temp-value" id="temp-0">--</div>
            <div class="temp-unit">&deg;F</div>
        </div>
        <div class="temp-card">
            <div class="temp-label">Living Room</div>
            <div class="temp-value" id="temp-1">--</div>
            <div class="temp-unit">&deg;F</div>
        </div>
        <div class="temp-card">
            <div class="temp-label">Bedroom</div>
            <div class="temp-value" id="temp-2">--</div>
            <div class="temp-unit">&deg;F</div>
        </div>
    </div>

    {% include 'asset_footer.html' %}

    <script>
        fetch('/current_temps')
            .then(r => r.json())
            .then(sensors => {
                sensors.forEach((s, i) => {
                    document.getElementById(`temp-${i}`).textContent =
                        s.temp_f !== null ? s.temp_f : 'N/A';
                });
            })
            .catch(err => console.error('Error fetching temps:', err));
    </script>
</body>
</html>
